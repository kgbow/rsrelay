name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override for test builds (defaults to Cargo.toml version)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: macOS Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve package version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
          else
            VER="$(awk -F'"' '/^\[workspace\.package\]/{in_ws=1; next} /^\[/{in_ws=0} in_ws && /^version *=/{print $2; exit}' Cargo.toml)"
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VER}"

      - name: Build Universal .app and .dmg
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./packaging/macos/package_dmg.sh --universal --version "${{ steps.meta.outputs.version }}"

      - name: Smoke-test packaged macOS binary
        shell: bash
        run: |
          ./target/macos-dmg-stage/dmg-root/rsrelay.app/Contents/MacOS/rsrelay-gui --check
          lipo -archs ./target/macos-dmg-stage/dmg-root/rsrelay.app/Contents/MacOS/rsrelay-gui

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows x64 Setup & Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (x86_64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve package version
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $Ver = $env:GITHUB_REF -replace "^refs/tags/v", ""
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.version }}")) {
            $Ver = "${{ inputs.version }}".TrimStart('v')
          } else {
            $CargoToml = Get-Content -Path "Cargo.toml"
            $InWs = $false
            foreach ($Line in $CargoToml) {
              if ($Line -match '^\[workspace\.package\]') { $InWs = $true; continue }
              if ($Line -match '^\[') { $InWs = $false }
              if ($InWs -and $Line -match '^version\s*=\s*"([^"]+)"') { $Ver = $Matches[1]; break }
            }
          }
          "version=$Ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $Ver"

      - name: Build Windows Setup (.exe) and Portable (.zip)
        shell: pwsh
        run: |
          ./packaging/windows/package_windows.ps1 -Version "${{ steps.meta.outputs.version }}"

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          body: |
            ### Downloads / 安装包说明
            - **Windows 10/11 (x64)**:
              - `*-windows-x64-setup.exe` — Recommended installer (includes optional Windows Firewall LAN rule & `--tray` autostart). / 推荐安装向导版（支持自动添加防火墙局域网放行规则与开机静默驻留托盘）。
              - `*-windows-x64-portable.zip` — Portable single executable (`rsrelay-gui.exe`). / 免安装绿色便携版。
            - **macOS 13+ (Apple Silicon & Intel Universal)**:
              - `*-macos-universal.dmg` — Drag `rsrelay.app` into `Applications`.
              - > **macOS 首次打开提示**：若未配置 Apple 付费公证而提示“无法验证开发者/已损坏”，请在终端执行一次 `xattr -cr /Applications/rsrelay.app` 即可正常打开并授权系统音频录制。
